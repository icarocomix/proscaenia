# Ho configurato la build per un PC con risorse limitate: niente daemon residente, niente
# parallelismo, heap contenuto e compilatore Kotlin nello stesso processo di Gradle.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true

# URL base della piattaforma Proscaenia: lo tengo qui (sovrascrivibile con -Pproscaenia.baseUrl=...)
# perché è l'unico punto da allineare se il dominio o l'ambiente cambiano. Deve terminare con "/".
proscaenia.baseUrl=https://proscaenia.com/backoffice/api/
